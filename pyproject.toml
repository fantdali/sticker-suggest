[project]
name = "sticker-suggest"
version = "0.1.0"
description = "Intelligent sticker suggestion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "easyocr>=1.7.2",
    "imagehash>=4.3.2",
    "numpy>=2.0",
    "open-clip-torch>=3.3.0",
    "pillow>=12.1.1",
    "torch>=2.11.0",
    "tqdm>=4.65",
]

[tool.uv]
dev-dependencies = [
    "datasets>=4.8.4",
    "matplotlib>=3.10.8",
    "opencv-python>=4.13.0.92",
    "paddle>=1.3.0",
    "paddleocr>=3.4.0",
    "pytesseract>=0.3.13",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
